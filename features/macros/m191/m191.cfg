### WARNING: Do not edit this file, changes will be overwritten! ###

# Override these values in custom/overrides.cfg. The installer adds any new
# defaults without replacing values already selected by the user.
[gcode_macro _M191_VARS]
variable_bed_assist_enabled: 1
variable_bed_assist_trigger_delta: 3.0
variable_bed_assist_bed_target: 105.0
variable_bed_assist_degrees_above_commanded: 0.0
variable_bed_assist_z_height: 195.0
variable_circulation_fan_speed: 15.0
variable_circulation_fan_high_speed: 100.0
variable_circulation_fan_low_seconds: 45.0
variable_circulation_fan_high_seconds: 20.0
variable_bed_restore_z_height: 30.0
variable_bed_restore_side_fan_speed: 100.0
variable_chamber_fan_margin: 2.0
variable_bed_restore_tolerance: 5.0
variable_chamber_wait_max_delta: 5.0
gcode:


[k2_m191_circulation]


[gcode_macro M191]
description: Set and wait for chamber temperature, with intelligent bed assist
gcode:
    SAVE_GCODE_STATE NAME=M191
    {% set S = params.S|default(0)|float %}

    {% if S == 0 %}
        # M191 controls the chamber only. Preserve bed, hotend, and part-fan
        # targets that a slicer may already have established.
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET=35
    {% else %}
        # Read all behavior settings from one shared block so START_PRINT and
        # M191 use the same chamber-fan target policy.
        {% set VARS = printer["gcode_macro _M191_VARS"] %}
        {% set BED_ASSIST_ENABLED = VARS.bed_assist_enabled|float %}
        {% set BED_ASSIST_TOLERANCE = VARS.bed_assist_trigger_delta|float %}
        {% set FIXED_BED_ASSIST_TARGET = VARS.bed_assist_bed_target|float %}
        {% set DEGREES_ABOVE_COMMANDED = VARS.bed_assist_degrees_above_commanded|float %}
        {% set BED_ASSIST_Z_HEIGHT = VARS.bed_assist_z_height|float %}
        {% set CIRCULATION_FAN_LOW_PERCENT = VARS.circulation_fan_speed|float %}
        {% set CIRCULATION_FAN_HIGH_PERCENT = VARS.circulation_fan_high_speed|float %}
        {% set CIRCULATION_FAN_LOW_SECONDS = VARS.circulation_fan_low_seconds|float %}
        {% set CIRCULATION_FAN_HIGH_SECONDS = VARS.circulation_fan_high_seconds|float %}
        {% set BED_RESTORE_Z_HEIGHT = VARS.bed_restore_z_height|float %}
        {% set BED_RESTORE_SIDE_FAN_PERCENT = VARS.bed_restore_side_fan_speed|float %}
        {% set CHAMBER_FAN_MARGIN = VARS.chamber_fan_margin|float %}
        {% set BED_RESTORE_TOLERANCE = VARS.bed_restore_tolerance|float %}
        {% set CHAMBER_WAIT_MAX_DELTA = VARS.chamber_wait_max_delta|float %}

        # Reject invalid configuration while the template is being rendered,
        # before Klipper executes any heater, fan, or movement command.
        {% if BED_ASSIST_ENABLED not in [0.0, 1.0] %}
            {action_raise_error("M191 bed_assist_enabled must be 0 or 1")}
        {% elif BED_ASSIST_TOLERANCE < 0.0 or BED_ASSIST_TOLERANCE > 20.0 %}
            {action_raise_error("M191 bed_assist_trigger_delta must be from 0 to 20 C")}
        {% elif FIXED_BED_ASSIST_TARGET <= 0.0 or FIXED_BED_ASSIST_TARGET > 120.0 %}
            {action_raise_error("M191 bed_assist_bed_target must be above 0 and no more than 120 C")}
        {% elif DEGREES_ABOVE_COMMANDED < 0.0 or DEGREES_ABOVE_COMMANDED > 120.0 %}
            {action_raise_error("M191 bed_assist_degrees_above_commanded must be from 0 to 120 C")}
        {% elif BED_ASSIST_Z_HEIGHT < 30.0 or BED_ASSIST_Z_HEIGHT > 330.0 %}
            {action_raise_error("M191 bed_assist_z_height must be from 30 to 330 mm")}
        {% elif CIRCULATION_FAN_LOW_PERCENT < 0.0 or CIRCULATION_FAN_LOW_PERCENT > 100.0 %}
            {action_raise_error("M191 circulation_fan_speed must be from 0 to 100 percent")}
        {% elif CIRCULATION_FAN_HIGH_PERCENT < 0.0 or CIRCULATION_FAN_HIGH_PERCENT > 100.0 %}
            {action_raise_error("M191 circulation_fan_high_speed must be from 0 to 100 percent")}
        {% elif CIRCULATION_FAN_HIGH_PERCENT < CIRCULATION_FAN_LOW_PERCENT %}
            {action_raise_error("M191 circulation_fan_high_speed must be at least circulation_fan_speed")}
        {% elif CIRCULATION_FAN_LOW_SECONDS <= 0.0 or CIRCULATION_FAN_LOW_SECONDS > 600.0 %}
            {action_raise_error("M191 circulation_fan_low_seconds must be above 0 and no more than 600 seconds")}
        {% elif CIRCULATION_FAN_HIGH_SECONDS <= 0.0 or CIRCULATION_FAN_HIGH_SECONDS > 600.0 %}
            {action_raise_error("M191 circulation_fan_high_seconds must be above 0 and no more than 600 seconds")}
        {% elif BED_RESTORE_Z_HEIGHT < 30.0 or BED_RESTORE_Z_HEIGHT > 330.0 %}
            {action_raise_error("M191 bed_restore_z_height must be from 30 to 330 mm")}
        {% elif BED_RESTORE_SIDE_FAN_PERCENT < 0.0 or BED_RESTORE_SIDE_FAN_PERCENT > 100.0 %}
            {action_raise_error("M191 bed_restore_side_fan_speed must be from 0 to 100 percent")}
        {% elif CHAMBER_FAN_MARGIN < 0.0 or CHAMBER_FAN_MARGIN > 10.0 %}
            {action_raise_error("M191 chamber_fan_margin must be from 0 to 10 C")}
        {% elif BED_RESTORE_TOLERANCE <= 0.0 or BED_RESTORE_TOLERANCE > 20.0 %}
            {action_raise_error("M191 bed_restore_tolerance must be above 0 and no more than 20 C")}
        {% elif CHAMBER_WAIT_MAX_DELTA <= 0.0 or CHAMBER_WAIT_MAX_DELTA > 20.0 %}
            {action_raise_error("M191 chamber_wait_max_delta must be above 0 and no more than 20 C")}
        {% endif %}

        {% set CHAMBER_TEMP = printer["temperature_sensor chamber_temp"].temperature|float %}
        {% set ACTUAL_BED_TEMP = printer.heater_bed.temperature|float %}
        {% set ORIGINAL_BED_TARGET = printer.heater_bed.target|float %}
        {% set BED_WAIT_MINIMUM = [ORIGINAL_BED_TARGET - BED_RESTORE_TOLERANCE, 0.0]|max %}
        {% set BED_ASSIST_THRESHOLD = S - BED_ASSIST_TOLERANCE %}
        {% set WAIT_FOR_CHAMBER = S > 35.0 %}
        # START_PRINT now knows the requested chamber temperature. Restore the
        # post-preparation exhaust ceiling immediately; the fan remains off
        # below this threshold and can cool a chamber that is already too hot.
        {% set FAN_TARGET = S + CHAMBER_FAN_MARGIN %}
        {% if DEGREES_ABOVE_COMMANDED > 0.0 %}
            {% set RAW_BED_ASSIST_TARGET = ORIGINAL_BED_TARGET + DEGREES_ABOVE_COMMANDED %}
        {% else %}
            {% set RAW_BED_ASSIST_TARGET = FIXED_BED_ASSIST_TARGET %}
        {% endif %}
        {% set BED_ASSIST_TARGET = [RAW_BED_ASSIST_TARGET, 120.0]|min %}
        {% set BED_ASSIST_HEATER_UNCAPPED = [ORIGINAL_BED_TARGET, BED_ASSIST_TARGET]|max %}
        {% set BED_ASSIST_HEATER_TARGET = [BED_ASSIST_HEATER_UNCAPPED, 120.0]|min %}
        {% set BED_TARGET_WILL_BE_RAISED = BED_ASSIST_HEATER_TARGET > ORIGINAL_BED_TARGET %}
        {% set USE_BED_ASSIST = BED_ASSIST_ENABLED == 1.0 and WAIT_FOR_CHAMBER and CHAMBER_TEMP < BED_ASSIST_THRESHOLD and BED_ASSIST_TARGET > ACTUAL_BED_TEMP %}
        {% set CIRCULATION_FAN_LOW_PWM = (CIRCULATION_FAN_LOW_PERCENT * 2.55)|round(0)|int %}
        {% set CIRCULATION_FAN_HIGH_PWM = (CIRCULATION_FAN_HIGH_PERCENT * 2.55)|round(0)|int %}
        {% set BED_RESTORE_SIDE_FAN_PWM = (BED_RESTORE_SIDE_FAN_PERCENT * 2.55)|round(0)|int %}

        M117 Heating chamber
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={FAN_TARGET}
        {% if WAIT_FOR_CHAMBER %}
            SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={S}
        {% else %}
            # Chamber requests at or below 35c are passive cooling targets.
            SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
        {% endif %}

        {% if USE_BED_ASSIST %}
            RESPOND MSG="Chamber is more than {BED_ASSIST_TOLERANCE}c below {S}c, using bed assist at {BED_ASSIST_TARGET|round(1)}c ..."
            {% if "xyz" not in printer.toolhead.homed_axes %}
              G28
            {% endif %}
            RESPOND MSG="Moving bed down below chamber heater for heat soak at Z={BED_ASSIST_Z_HEIGHT|round(1)} ..."
            G90
            G1 Z{BED_ASSIST_Z_HEIGHT} F600
            RESPOND MSG="Starting model and side fan circulation at {CIRCULATION_FAN_LOW_PERCENT|round(1)}% for {CIRCULATION_FAN_LOW_SECONDS|round(1)} seconds, then {CIRCULATION_FAN_HIGH_PERCENT|round(1)}% for {CIRCULATION_FAN_HIGH_SECONDS|round(1)} seconds ..."
            {% if BED_TARGET_WILL_BE_RAISED %}
              RESPOND MSG="Raising bed target to {BED_ASSIST_HEATER_TARGET|round(1)}c for chamber assistance ..."
              SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_ASSIST_HEATER_TARGET}
            {% else %}
              RESPOND MSG="Commanded bed target is already at or above the calculated assist target, not changing it ..."
            {% endif %}
        {% elif WAIT_FOR_CHAMBER and BED_ASSIST_ENABLED == 0.0 %}
            RESPOND MSG="Bed assist is disabled, waiting for chamber heater only ..."
        {% elif WAIT_FOR_CHAMBER and BED_ASSIST_TARGET <= ACTUAL_BED_TEMP %}
            RESPOND MSG="Bed is already at or above the {BED_ASSIST_TARGET|round(1)}c assist target, bed assist not needed ..."
        {% elif WAIT_FOR_CHAMBER %}
            RESPOND MSG="Chamber is within {BED_ASSIST_TOLERANCE}c of {S}c at {CHAMBER_TEMP|round(1)}c, bed assist not needed ..."
        {% endif %}

        {% if WAIT_FOR_CHAMBER %}
            {% if USE_BED_ASSIST %}
                K2_M191_CIRCULATION_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={S} MAXIMUM={S + CHAMBER_WAIT_MAX_DELTA} LOW_PWM={CIRCULATION_FAN_LOW_PWM} HIGH_PWM={CIRCULATION_FAN_HIGH_PWM} LOW_SECONDS={CIRCULATION_FAN_LOW_SECONDS} HIGH_SECONDS={CIRCULATION_FAN_HIGH_SECONDS} CYCLE_FANS=1 REPORT_ID=C REPORT_TARGET={S}
            {% else %}
                K2_M191_CIRCULATION_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={S} MAXIMUM={S + CHAMBER_WAIT_MAX_DELTA} LOW_PWM={CIRCULATION_FAN_LOW_PWM} HIGH_PWM={CIRCULATION_FAN_HIGH_PWM} LOW_SECONDS={CIRCULATION_FAN_LOW_SECONDS} HIGH_SECONDS={CIRCULATION_FAN_HIGH_SECONDS} CYCLE_FANS=0 REPORT_ID=C REPORT_TARGET={S}
            {% endif %}

            # Bed assist and circulation are temporary. Stop both circulation
            # fans, restore the slicer's bed target when it was raised, and let
            # the bed settle before START_PRINT continues.
            {% if USE_BED_ASSIST %}
                RESPOND MSG="Chamber temperature reached, turning model and side fans off ..."
                M106 S0
                M106 P2 S0
                {% if BED_TARGET_WILL_BE_RAISED %}
                    RESPOND MSG="Restoring bed target to {ORIGINAL_BED_TARGET}c ..."
                    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={ORIGINAL_BED_TARGET}
                    {% if ORIGINAL_BED_TARGET > 0.0 %}
                        RESPOND MSG="Moving bed to Z={BED_RESTORE_Z_HEIGHT|round(1)} and running the side fan at {BED_RESTORE_SIDE_FAN_PERCENT|round(1)}% while the bed returns to print temperature ..."
                        G90
                        G1 Z{BED_RESTORE_Z_HEIGHT} F600
                        M106 P2 S{BED_RESTORE_SIDE_FAN_PWM}
                        RESPOND MSG="Waiting for bed to return within {BED_RESTORE_TOLERANCE}c of original {ORIGINAL_BED_TARGET}c target ..."
                        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_WAIT_MINIMUM} MAXIMUM={ORIGINAL_BED_TARGET + BED_RESTORE_TOLERANCE}
                        M106 P2 S0
                        RESPOND MSG="Bed is within {BED_RESTORE_TOLERANCE}c of its original target, side fan off ..."
                        RESPOND MSG="Rechecking chamber target after bed cooling ..."
                        K2_M191_CIRCULATION_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={S} MAXIMUM={S + CHAMBER_WAIT_MAX_DELTA} LOW_PWM={CIRCULATION_FAN_LOW_PWM} HIGH_PWM={CIRCULATION_FAN_HIGH_PWM} LOW_SECONDS={CIRCULATION_FAN_LOW_SECONDS} HIGH_SECONDS={CIRCULATION_FAN_HIGH_SECONDS} CYCLE_FANS=0 REPORT_ID=C REPORT_TARGET={S}
                    {% else %}
                        RESPOND MSG="Original bed target was off, skipping bed target wait ..."
                    {% endif %}
                {% endif %}
            {% endif %}

            RESPOND MSG="Chamber temperature {S}c reached ..."
        {% else %}
            RESPOND MSG="Chamber target {S}c is at or below the 35c active-heating threshold, continuing without a chamber wait ..."
        {% endif %}
    {% endif %}
    RESTORE_GCODE_STATE NAME=M191
