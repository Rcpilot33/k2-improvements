### WARNING: Do not edit this file, changes will be overwritten! ###

# to make changes, copy this macro to the overrides.cfg in the custom/ directory

[gcode_macro M191]
description: Set and wait for chamber temperature, with intelligent bed assist
gcode:
    SAVE_GCODE_STATE NAME=M191
    # Parameters
    {% set S = params.S|default(0)|float %}
    {% set FAN_TARGET = S + 2.0 %}
    {% set CHAMBER_TEMP = printer["temperature_sensor chamber_temp"].temperature|float %}
    {% set ORIGINAL_BED_TARGET = printer.heater_bed.target|float %}
    {% set BED_WAIT_MINIMUM = [ORIGINAL_BED_TARGET - 5.0, 0.0]|max %}
    {% set USE_BED_ASSIST = S > 35.0 and CHAMBER_TEMP < S %}

    {% if S == 0 %}
        TURN_OFF_HEATERS
        M107
    {% else %}
        M117 Heating chamber
        # Keep the exhaust fan above the heater setpoint so the two controls
        # do not fight each other because of sensor variation or hysteresis.
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={FAN_TARGET}
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={S}

        {% if USE_BED_ASSIST %}
            RESPOND MSG="The chamber heater alone can not reach {S}c, using bed assist ..."
            # bed needs to raise to near the nozzle
            {% if "xyz" not in printer.toolhead.homed_axes %}
              G28
            {% endif %}
            RESPOND MSG="Moving bed down below chamber heater for heat soak (Z=195) ..."
            G90
            G1 Z195 F600
            M400
            RESPOND MSG="Turning model and side fans on at 25% for chamber circulation ..."
            M106 S64
            M106 P2 S64
            {% if printer.heater_bed.target > 99.0 %}
              RESPOND MSG="Bed target temp already high enough, not changing ..."
            {% else %}
              RESPOND MSG="Bed target temp not high enough, setting to 105c ..."
              SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=105
            {% endif %}
        {% elif S > 35.0 %}
            RESPOND MSG="Chamber is already at {CHAMBER_TEMP|round(1)}c, bed assist not needed ..."
        {% endif %}

        # Wait indefinitely for temperature
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp"  MINIMUM={S} MAXIMUM={S+5}

        # Bed assist and circulation are temporary. Stop both circulation
        # fans, restore the slicer's bed target, and let the bed settle before
        # START_PRINT continues with homing and meshing.
        {% if USE_BED_ASSIST %}
            RESPOND MSG="Chamber temperature reached, turning model and side fans off ..."
            M106 S0
            M106 P2 S0
            {% if ORIGINAL_BED_TARGET <= 99.0 %}
                RESPOND MSG="Restoring bed target to {ORIGINAL_BED_TARGET}c ..."
                SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={ORIGINAL_BED_TARGET}
            {% endif %}
            {% if ORIGINAL_BED_TARGET > 0.0 %}
                RESPOND MSG="Waiting for bed to return within 5c of original {ORIGINAL_BED_TARGET}c target ..."
                TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_WAIT_MINIMUM} MAXIMUM={ORIGINAL_BED_TARGET + 5.0}
                RESPOND MSG="Bed is within 5c of its original target ..."
            {% else %}
                RESPOND MSG="Original bed target was off, skipping bed target wait ..."
            {% endif %}
        {% endif %}

        RESPOND MSG="Chamber temperature {S}c reached ..."
    {% endif %}
    RESTORE_GCODE_STATE NAME=M191
