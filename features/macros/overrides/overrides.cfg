# including some common overrides, feel free to change these to your liking

[virtual_sdcard]
forced_leveling: false

[bed_mesh]
probe_count:19,19 #50,50 is a good starting point if using carto

[gcode_macro _START_PRINT_VARS]
variable_offset_PLA: 0
variable_offset_PETG: 0
variable_offset_ABS: 0
variable_offset_ASA: 0
variable_offset_DEFAULT: 0
variable_offset_PROBE: 0
variable_heat_soak: 0 # minutes
variable_bed_mesh_soak: 5 # minutes; set to 0 if the printer is already heat soaked
variable_carto_touch_calibrate_start: 500
gcode:

# Cartographer-only default. The installer activates this section in the
# installed overrides.cfg when Cartographer is present.
# [cartographer touch]
# max_noisy_samples: 2
