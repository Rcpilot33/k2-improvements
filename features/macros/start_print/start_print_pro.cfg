# K2 Pro F012 with factory PR Touch. Loaded after the shared START_PRINT helpers.
[gcode_macro _K2_PRO_FINAL_Z_HOME]
gcode:
  {% if 'cartographer' in printer or 'prtouch_v3' not in printer %}
    {action_raise_error("The K2 Pro final Z home requires the stock PR Touch probe")}
  {% endif %}
  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Cleaning nozzle for final native Z home..."
  BOX_NOZZLE_CLEAN
  M109 S140
  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Setting final native Z..."
  NEXT_HOMEZ_NACCU
  G28 Z
  BED_MESH_CLEAR

[gcode_macro START_PRINT]
variable_prepare: 0
gcode:
  {% if 'cartographer' in printer or 'prtouch_v3' not in printer %}
    {action_raise_error("The K2 Pro START_PRINT profile requires the stock PR Touch probe")}
  {% endif %}
  {% set BED = params.BED_TEMP|default(60)|float %}
  {% set HOTEND = params.EXTRUDER_TEMP|default(220)|float %}
  {% set CHAMBER = params.CHAMBER_TEMP|default(0)|float %}
  {% set VARS = printer["gcode_macro _START_PRINT_VARS"] %}
  {% set SOAK = params.SOAK_TIME|default(VARS.heat_soak)|float %}
  {% set FAN_MARGIN = printer["gcode_macro _M191_VARS"].chamber_fan_margin|float %}
  {% set MATERIAL = params.MATERIAL|default("")|string %}
  {% set SURFACE = params.SURFACE|default("")|string|lower %}
  {% set PROFILE = BED|string + 'c_' + CHAMBER|string + 'c' %}
  {% if SURFACE and 'gcode_macro _PLATE_AWARE_MESH' in printer %}
    {% set PROFILE = SURFACE + '_' + PROFILE %}
  {% endif %}
  {% set PREPARE_FLAG = printer["gcode_macro START_PRINT"].prepare|int %}
  {% set PREPARED = PREPARE_FLAG and printer.toolhead.homed_axes == 'xyz' %}
  {% if not (0 <= SOAK <= 120) %}
    {action_raise_error("START_PRINT heat soak must be from 0 to 120 minutes")}
  {% elif not (0 <= FAN_MARGIN <= 10) %}
    {action_raise_error("M191 chamber_fan_margin must be from 0 to 10 C")}
  {% endif %}
  {% if 'prime_tower' in printer %}
    PRIME_TOWER_WAIT
  {% endif %}
  STATUS_MSG PREFIX="[START_PRINT]:" DISPLAY=no MSG="Print targets: Nozzle={HOTEND}C Bed={BED}C Chamber={CHAMBER}C"
  TMC2208_STEALTHCHOP STEPPER=stepper_z VAL=0
  BOX_START_PRINT
  _RELEASE_PREPRINT_CASE_FAN
  SET_TEMPERATURE_FAN_SWITCH TEMPERATURE_FAN=chamber_fan VALUE=1
  SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={CHAMBER + FAN_MARGIN if CHAMBER > 0 else 35}
  SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={CHAMBER if CHAMBER|int > 40 else 0}
  G90
  SET_GCODE_OFFSET Z=0
  {% if 'k2_prtouch_global_z' in printer %}
    K2_PRTOUCH_GLOBAL_Z_RESET
  {% endif %}
  {% if PREPARE_FLAG %}
    PRINT_PREPARE_CLEAR
  {% endif %}
  M140 S{BED}
  {% if not PREPARED %}
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="Preheating nozzle to 140°C and homing..."
    M106 S0 F1
    M104 S140
    SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=5000
    G28
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="Cleaning nozzle..."
    NOZZLE_CLEAR
    M104 S140
  {% else %}
    STATUS_MSG PREFIX="[START_PRINT]:" DISPLAY=no MSG="Using completed printer preparation with homed axes"
  {% endif %}
  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Waiting for bed to reach {BED}°C..."
  M190 S{BED}
  {% if CHAMBER|int > 40 %}
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="Waiting for chamber to reach {CHAMBER}°C..."
  {% endif %}
  M191 S{CHAMBER}
  {% if SOAK > 0 %}
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="Machine heat soaking for {SOAK} minutes..."
    G4 P{(SOAK * 60000)|int}
  {% endif %}
  RESPOND MSG="Looking for {PROFILE} ..."
  {% if PROFILE in printer.bed_mesh.profiles %}
    RESPOND MSG="{PROFILE} exists ..."
    {% if not PREPARED %}
      M109 S140
      _K2_PRO_FINAL_Z_HOME
    {% endif %}
  {% else %}
    # Mesh creation establishes the final pressure reference after its own soak.
    RESPOND MSG="{PROFILE} does not exist, creating ..."
    _CREATE_MESH BED_TEMP={BED} CHAMBER_TEMP={CHAMBER} SURFACE="{SURFACE}"
  {% endif %}
  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Loading bed mesh: {PROFILE}..."
  BED_MESH_PROFILE LOAD={PROFILE}
  M140 S{BED}
  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Setting extruder to {HOTEND}°C..."
  M104 S{HOTEND}
  BOX_GO_TO_EXTRUDE_POS
  M190 S{BED}
  M109 S{HOTEND}
  M220 S100
  G21
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=10
  M204 S5000
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL=5000
  BOX_NOZZLE_CLEAN
  G92 E0
  {% if 'k2_material_z_offset_editor' in printer %}
    K2_MATERIAL_Z_APPLY MATERIAL="{MATERIAL}"
  {% else %}
    {% set OFFSET = VARS.get('offset_' + MATERIAL|lower, VARS.offset_default) %}
    {% if MATERIAL %}
      STATUS_MSG PREFIX="[START_PRINT]:" DISPLAY=no MSG="Setting Z offset of {OFFSET} for {MATERIAL}"
    {% else %}
      STATUS_MSG PREFIX="[START_PRINT]:" DISPLAY=no MSG="Using Z offset {OFFSET} because no material was supplied"
    {% endif %}
    SET_GCODE_OFFSET Z={OFFSET}
  {% endif %}
  {% if 'k2_prtouch_global_z' in printer %}
    K2_PRTOUCH_GLOBAL_Z_APPLY SURFACE={SURFACE if SURFACE else 'default'}
  {% endif %}
  SET_PIN PIN=extruder_fan VALUE=1
  SET_PIN PIN=board_dissipation_fan VALUE=1
  SET_TEMPERATURE_FAN_SWITCH TEMPERATURE_FAN=chamber_fan VALUE=1
  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Start_Print macro has finished"
