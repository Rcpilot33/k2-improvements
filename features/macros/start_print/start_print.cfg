# if unintended changes are made to this file, restore with:
#   git -C /mnt/UDISK/root/k2-improvements restore features/macros/start_print/start_print.cfg

[gcode_macro _START_PRINT_VARS]
######################################################################
# copy this to overrides.cfg or edit here
######################################################################
variable_offset_PLA: 0.05
variable_offset_PETG: 0.05
variable_offset_ABS: 0.05
variable_offset_ASA: 0.05
variable_offset_DEFAULT: 0.05
variable_heat_soak: 0 # minutes
variable_bed_mesh_soak: 5 # minutes; used only when creating a missing saved mesh
variable_carto_touch_calibrate_start: 500
gcode:


[gcode_macro _CARTOGRAPHER_TOUCH_HOME_WITH_TEMPS]
description: Log live temperatures immediately before Cartographer Touch Home
gcode:
  {% set CARTOGRAPHER_TEMP = printer["temperature_sensor cartographer"].temperature|float %}
  {% set COIL_TEMP = printer["temperature_sensor cartographer_coil"].temperature|float %}
  {% set BED_TEMP = printer.heater_bed.temperature|float %}
  {% set NOZZLE_TEMP = printer.extruder.temperature|float %}
  STATUS_MSG PREFIX="[CARTOGRAPHER]:" DISPLAY=no MSG="Touch Home temperatures: board={CARTOGRAPHER_TEMP|round(1)}C coil={COIL_TEMP|round(1)}C bed={BED_TEMP|round(1)}C nozzle={NOZZLE_TEMP|round(1)}C"
  CARTOGRAPHER_TOUCH_HOME


# Creality's print preparation can leave both a direct case-fan request and a
# temporary chamber-fan target active. Evaluate this helper as a separate macro
# so it reads fan1 after the preceding command has executed, not while
# START_PRINT is initially rendered. START_PRINT releases BOX_START_PRINT's
# request immediately, then restores the requested chamber policy. The
# BOX_NOZZLE_CLEAN wrapper calls it again in case cleaning reasserted the direct
# request; an already-zero request remains a no-op.
[gcode_macro _RELEASE_PREPRINT_CASE_FAN]
description: Release Creality's direct pre-print case-fan request if active
gcode:
  {% set DIRECT_CASE_FAN = printer["output_pin fan1"].value|default(0)|float if "output_pin fan1" in printer else 0.0 %}
  {% if DIRECT_CASE_FAN > 0.0 %}
    M107 P1
    STATUS_MSG PREFIX="[CASE_FAN]:" DISPLAY=no MSG="Released Creality pre-print case-fan override"
  {% endif %}


[gcode_macro BOX_NOZZLE_CLEAN]
rename_existing: _K2_ORIGINAL_BOX_NOZZLE_CLEAN
gcode:
  _K2_ORIGINAL_BOX_NOZZLE_CLEAN {rawparams}
  _RELEASE_PREPRINT_CASE_FAN


[gcode_macro START_PRINT]
# be sure to update your slicer machine gcode to pass in both chamber temp and material type:
# START_PRINT EXTRUDER_TEMP=[nozzle_temperature_initial_layer] BED_TEMP=[bed_temperature_initial_layer_single] CHAMBER_TEMP=[overall_chamber_temperature] MATERIAL={filament_type[initial_tool]}
gcode:
  # If Cartographer or KAMP installed the optional prime-tower scanner,
  # reject unsupported delayed towers before any printer preparation moves.
  {% if 'prime_tower' in printer %}
    PRIME_TOWER_WAIT
  {% endif %}
  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Start print macro called with {params}"
  BOX_START_PRINT
  _RELEASE_PREPRINT_CASE_FAN
  G90
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
  {% set EXTRUDER_WAITTEMP = 140 %}
  {% set MATERIAL = params.MATERIAL|default("")|string %}
  {% set SURFACE = params.SURFACE|default("")|string|lower %}
  {% set SOAK_TIME = params.SOAK_TIME|default(printer["gcode_macro _START_PRINT_VARS"].heat_soak)|float %}
  {% set CHAMBER_FAN_MARGIN = printer["gcode_macro _M191_VARS"].chamber_fan_margin|float %}
  {% if SOAK_TIME < 0.0 or SOAK_TIME > 120.0 %}
    {action_raise_error("START_PRINT heat soak must be from 0 to 120 minutes")}
  {% elif CHAMBER_FAN_MARGIN < 0.0 or CHAMBER_FAN_MARGIN > 10.0 %}
    {action_raise_error("M191 chamber_fan_margin must be from 0 to 10 C")}
  {% endif %}

  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Preheating: Nozzle={EXTRUDER_WAITTEMP}C Bed={BED_TEMP}C Chamber={CHAMBER_TEMP}C"
  M104 S{EXTRUDER_WAITTEMP}
  M140 S{BED_TEMP}
  # Creality preparation temporarily changes this target to 30 C. Restore the
  # intended policy at the print handoff instead of carrying that preparation
  # target through the print.
  {% if CHAMBER_TEMP > 35 %}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={CHAMBER_TEMP + CHAMBER_FAN_MARGIN}
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={CHAMBER_TEMP}
  {% elif CHAMBER_TEMP > 0 %}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={CHAMBER_TEMP + CHAMBER_FAN_MARGIN}
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
  {% else %}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET=35
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
  {% endif %}

  {% if "k2_material_z_offset_editor" in printer %}
    # The optional helper normalizes slicer material names, applies the active
    # value, and records an unknown material for adjustment after this print.
    K2_MATERIAL_Z_APPLY MATERIAL="{MATERIAL}"
  {% else %}
    {% if MATERIAL == "" %}
      {% set OFFSET = printer["gcode_macro _START_PRINT_VARS"].offset_default %}
      STATUS_MSG PREFIX="[START_PRINT]:" MSG="WARNING: Material type not passed into START_PRINT! Using default Z offset of {OFFSET}. See start_print.cfg for slicer setup." TYPE=error
    {% else %}
      {% set OFFSET = printer["gcode_macro _START_PRINT_VARS"].get("offset_" + MATERIAL|lower, printer["gcode_macro _START_PRINT_VARS"].offset_default) %}
      STATUS_MSG PREFIX="[START_PRINT]:" MSG="Setting Z offset of {OFFSET} for {MATERIAL}"
    {% endif %}
    SET_GCODE_OFFSET Z={OFFSET}
  {% endif %}

  HOME_IF_NEEDED

  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Waiting for bed to reach {BED_TEMP}°C..."
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 0.5} MAXIMUM={BED_TEMP + 1}

  {% if CHAMBER_TEMP > 35 %} # Creality actively heats only above 35c.
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="Waiting for chamber to reach {CHAMBER_TEMP}°C..."
    M191 S{CHAMBER_TEMP}
  {% endif %}

  # Hold the complete machine at its requested print temperatures. For an
  # active chamber target this begins only after M191 has reached the chamber
  # target and restored a temporarily raised bed target.
  {% for i in range(0, (SOAK_TIME * 60) | int, 60) %}
    {% set COUNTDOWN = (SOAK_TIME * 60) | int - i %}
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="Machine heat soaking: {COUNTDOWN // 60} min {COUNTDOWN % 60} sec left"
    G4 P{(60000 if COUNTDOWN > 60 else COUNTDOWN * 1000)}
  {% endfor %}

  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Rehoming Z after reaching bedtemp/soak"
  G28 Z

  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Adjusting bed tilt..."
  Z_TILT_ADJUST

  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Waiting for extruder to reach {EXTRUDER_WAITTEMP}°C..."
  M109 S{EXTRUDER_WAITTEMP}

# Carto/pr mesh logic
  {% if printer.cartographer %}
    # Keep the adaptive mesh large enough to contain the user-selected KAMP
    # purge offset after LINE_PURGE applies its 0.5mm boundary inset. This
    # lets purge_margin remain a real tuning option instead of requiring a
    # hidden value below Cartographer's configured adaptive_margin.
    {% set CARTO_ADAPTIVE_MARGIN = printer.configfile.settings.bed_mesh.adaptive_margin|default(0)|float %}
    {% set KAMP_BOUNDARY_INSET = 0.5 %}
    {% set KAMP_MESH_SLACK = 1.0 %}
    {% if 'gcode_macro _KAMP_Settings' in printer %}
      {% set KAMP_PURGE_MARGIN = printer["gcode_macro _KAMP_Settings"].purge_margin|float %}
      # Keep the purge path inside, rather than exactly on, the realized
      # adaptive-mesh boundary.  Exact-edge comparisons can fail from normal
      # floating-point rounding even when the corridor is visibly available.
      {% set CARTO_ADAPTIVE_MARGIN = [CARTO_ADAPTIVE_MARGIN, KAMP_PURGE_MARGIN + KAMP_BOUNDARY_INSET + KAMP_MESH_SLACK]|max %}
    {% endif %}
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="Carto meshing bed"
    BED_MESH_CALIBRATE PROFILE=adaptive ADAPTIVE=1 ADAPTIVE_MARGIN={CARTO_ADAPTIVE_MARGIN}
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="Setting Z offset with carto after nozzle clean..."
    BOX_NOZZLE_CLEAN
    _CARTOGRAPHER_TOUCH_HOME_WITH_TEMPS
  {% else %}
    {% set PLATE_AWARE = 'gcode_macro _PLATE_AWARE_MESH' in printer %}
    {% if PLATE_AWARE and SURFACE %}
      MESH_IF_NEEDED BED_TEMP={BED_TEMP} CHAMBER_TEMP={CHAMBER_TEMP} SURFACE={SURFACE}
      {% set mesh_name = SURFACE + '_' + BED_TEMP|string + 'c_' + CHAMBER_TEMP|string + 'c' %}
    {% else %}
      MESH_IF_NEEDED BED_TEMP={BED_TEMP} CHAMBER_TEMP={CHAMBER_TEMP}
      {% set mesh_name = BED_TEMP|string + 'c_' + CHAMBER_TEMP|string + 'c' %}
    {% endif %}
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="Loading bed mesh: {mesh_name}..."
    BED_MESH_PROFILE LOAD={mesh_name}
  {% endif %}
  BOX_GO_TO_EXTRUDE_POS

  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Setting extruder to {EXTRUDER_TEMP}°C..."
  M109 S{EXTRUDER_TEMP}
  G0 Y350

  SET_PIN PIN=extruder_fan VALUE=1
  M220 S100
  G21
  SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=5000 SQUARE_CORNER_VELOCITY=10
  G92 E0

  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Start_Print macro has finished"



  # Helper macros
[gcode_macro STATUS_MSG]
gcode:
  {% set MESSAGE = params.MSG|default('')|string %}
  {% set TYPE = params.TYPE|default('echo')|string %}
  {% set PREFIX = params.PREFIX|default('')|string %}
  {% set DISPLAY = params.DISPLAY|default('yes')|lower in ['yes', 'true', '1'] %}
  {% if DISPLAY %}
    M117 {MESSAGE}
  {% endif %}
  {% if TYPE == "error" %}
    RESPOND TYPE=error MSG="{MESSAGE}"
  {% else %}
    RESPOND PREFIX="{PREFIX}" MSG="{MESSAGE}"
  {% endif %}

[gcode_macro HOME_IF_NEEDED]
description: Homes axes when needed. Usage: HOME_IF_NEEDED [AXIS=<x|y|z|xy|xyz|etc>]
gcode:
  {% set homed = printer.toolhead.homed_axes %}
  {% set axis = params.AXIS|default("xyz")|lower %}
  
  {% set needs_x = "x" in axis and "x" not in homed %}
  {% set needs_y = "y" in axis and "y" not in homed %}
  {% set needs_z = "z" in axis and "z" not in homed %}
  
  {% if needs_z %}
    G28 Z
  {% elif needs_x or needs_y %}
    # Home Y first to avoid homing X while inside the back corridor
    G28 X Y
  {% endif %}
