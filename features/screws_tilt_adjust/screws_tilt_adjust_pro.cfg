[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: _OG_SCREWS_TILT_CALCULATE
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    _OG_SCREWS_TILT_CALCULATE {rawparams}

[screws_tilt_adjust]
screw1: 9, 59
screw1_name: Front Left
screw2: 290, 59
screw2_name: Front Right
screw3: 290, 239
screw3_name: Rear Right
screw4: 9, 239
screw4_name: Rear Left
speed: 150
horizontal_move_z: 10
screw_thread: CW-M4
