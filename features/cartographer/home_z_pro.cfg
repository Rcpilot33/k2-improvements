
# RC3 factory homing supplies the XY and optical Z preparation. Home the
# nozzle at the configured reference for every mount on the 300 mm bed.
[gcode_macro _HOME_Z]
gcode:
    {% set ready = printer['gcode_macro xyz_ready'] %}
    {% if ready.x_ready|int and ready.y_ready|int %}
      _IF_HOME_Z
    {% endif %}
    {% if printer.print_stats.z_pos|float >= 260 %}
      FORCE_MOVE STEPPER=stepper_z DISTANCE=-8 VELOCITY=10
    {% endif %}
    {% set center = printer.configfile.settings.bed_mesh.zero_reference_position %}
    G91
    M204 S2000
    G1 X{center[0] - printer.toolhead.position.x} Y{center[1] - printer.toolhead.position.y} F12000
    G90
    M204 S500
    G28 Z
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=z_ready VALUE=1
    G1 Z5 F600
