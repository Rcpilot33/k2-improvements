[mcu cartographer]
serial: /dev/cartographer
restart_method: command
is_non_critical: True
reconnect_interval: 2.0
[cartographer]
mcu: cartographer
x_offset: 0
y_offset: -15
verbose: yes

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 0
max_temp: 105

[bed_mesh]
zero_reference_position: 175, 175
speed: 200
mesh_min: 10, 5
mesh_max: 340, 330
probe_count: 31, 31
mesh_pps: 0, 0
adaptive_margin: 10
fade_start: 5.0
fade_end: 50.0
bicubic_tension: 0.2
algorithm: bicubic
horizontal_move_z: 3
split_delta_z: 0.01
move_check_distance: 3

[stepper_y]
position_endstop: -0.4
position_min: -0.4

[stepper_z]
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0

## Leave this commented unless you have a use for the cartographer accelerometer and know what you are doing.
# [adxl345]
# cs_pin: cartographer:PA3 # Change to PA0 if you have V4
# spi_bus: spi1

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_ORIG
gcode:
    # Set speed/accel limits for consistent meshes so bed mesh speed is not bottlenecked by prior limits.
    {% set old_velocity = printer.toolhead.max_velocity %}
    {% set old_scv = printer.toolhead.square_corner_velocity %}
    {% set old_accel = printer.toolhead.max_accel %}
    {% set old_accel_to_decel = printer.toolhead.max_accel_to_decel %}
    SAVE_GCODE_STATE NAME=CARTO_BED_MESH_CALIBRATE_STATE
    SET_VELOCITY_LIMIT VELOCITY=800 SQUARE_CORNER_VELOCITY=5 ACCEL=10000 ACCEL_TO_DECEL=5000
    BED_MESH_CALIBRATE_ORIG {rawparams}
    # Restore previous limits and gcode state
    SET_VELOCITY_LIMIT VELOCITY={old_velocity} SQUARE_CORNER_VELOCITY={old_scv} ACCEL={old_accel} ACCEL_TO_DECEL={old_accel_to_decel}
    RESTORE_GCODE_STATE NAME=CARTO_BED_MESH_CALIBRATE_STATE MOVE=0

# Creality's closed print service calls SAFE_MOVE_Z between consecutive prints.
# The stock PR Touch extension provides that command, but it is unloaded when
# Cartographer replaces [prtouch_v3]. c440x supplies a signed relative distance
# and speed which place Z at 20mm before the next print is prepared.
[gcode_macro SAFE_MOVE_Z]
description: Handle Creality's guarded inter-print Z=20 safe move
gcode:
    {% set state = params.STA|default(0)|int %}
    {% if state == 1 %}
        {% if params.DIS is not defined or params.SPD is not defined %}
            {action_raise_error("[SAFE_MOVE_Z] STA=1 requires DIS and SPD")}
        {% endif %}
        {% if "z" not in printer.toolhead.homed_axes %}
            {action_raise_error("[SAFE_MOVE_Z] Refusing move because Z is not homed")}
        {% endif %}
        {% if printer.print_stats.state in ["printing", "paused"] %}
            {action_raise_error("[SAFE_MOVE_Z] Refusing inter-print move while a print is active")}
        {% endif %}

        {% set distance = params.DIS|float %}
        {% set speed = params.SPD|float %}
        {% set current_z = printer.toolhead.position.z|float %}
        {% set target_z = current_z + distance %}
        {% set min_z = printer.toolhead.axis_minimum.z|float %}
        {% set max_z = printer.toolhead.axis_maximum.z|float %}

        # The observed c440x contract always computes DIS to finish at Z=20.
        # Constraining the endpoint prevents this compatibility command from
        # becoming a general-purpose path for arbitrary touchscreen motion.
        {% if (target_z - 20.0)|abs > 0.25 %}
            {action_raise_error("[SAFE_MOVE_Z] Refusing unexpected target Z=%.3f" % target_z)}
        {% endif %}
        {% if target_z < min_z or target_z > max_z %}
            {action_raise_error("[SAFE_MOVE_Z] Target Z=%.3f is outside machine limits" % target_z)}
        {% endif %}
        {% set max_z_speed = printer.configfile.settings.printer.max_z_velocity|float %}
        {% if speed <= 0.0 or speed > max_z_speed %}
            {action_raise_error("[SAFE_MOVE_Z] Refusing invalid speed %.3fmm/s" % speed)}
        {% endif %}

        {action_respond_info("[SAFE_MOVE_Z] Moving Z %.3fmm to %.3fmm at %.3fmm/s" % (distance, target_z, speed))}
        SAVE_GCODE_STATE NAME=SAFE_MOVE_Z_STATE
        G91
        G1 Z{distance} F{speed * 60.0}
        M400
        RESTORE_GCODE_STATE NAME=SAFE_MOVE_Z_STATE MOVE=0
    {% elif state == 0 %}
        {action_respond_info("[SAFE_MOVE_Z] Stop/cleanup request acknowledged")}
    {% else %}
        {action_raise_error("[SAFE_MOVE_Z] Unsupported STA=%d" % state)}
    {% endif %}
