name: Installer tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: |
          git ls-files -z -- '*.sh' '*.init' 'features/better-init/bin/*' scripts/delete-camera scripts/moonraker-api |
            xargs -0 shellcheck -S error --

  tests:
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install Jinja2==3.1.6 "numpy==2.0.2; python_version < '3.10'" "numpy==2.2.1; python_version >= '3.10'"
      - run: python scripts/run_tests.py
