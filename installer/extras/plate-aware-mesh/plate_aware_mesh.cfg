[gcode_macro _PLATE_AWARE_MESH]
description: Enables slicer-selected build-plate names in saved mesh profiles
gcode:
  RESPOND PREFIX="[PLATE_AWARE_MESH]:" MSG="Enabled; pass SURFACE=<name> to START_PRINT"


[gcode_macro PLATE_AWARE_MESH_STATUS]
description: Preview the saved mesh name without moving the printer
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
  {% set SURFACE = params.SURFACE|default('')|string|lower %}
  {% if SURFACE %}
    {% set PROFILE_NAME = SURFACE + '_' + BED_TEMP|string + 'c_' + CHAMBER_TEMP|string + 'c' %}
  {% else %}
    {% set PROFILE_NAME = BED_TEMP|string + 'c_' + CHAMBER_TEMP|string + 'c' %}
  {% endif %}
  RESPOND PREFIX="[PLATE_AWARE_MESH]:" MSG="Resolved profile: {PROFILE_NAME}"
