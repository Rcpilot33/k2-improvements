# Cartographer macros — wrapped CARTOGRAPHER_* commands for Fluidd buttons.
#
# The numeric prefixes keep each plate's scan, touch, and load buttons
# together at the top of Fluidd's alphabetical macro list.

# ===== DEFAULT / FALLBACK =====

[gcode_macro A11_CARTO_SCAN_DEFAULT]
description: Calibrate Cartographer SCAN model for fallback default plate
gcode:
    CARTOGRAPHER_SCAN_CALIBRATE METHOD=manual MODEL=default

[gcode_macro A12_CARTO_TOUCH_DEFAULT]
description: Calibrate Cartographer TOUCH model for fallback default plate
gcode:
    CARTOGRAPHER_TOUCH_CALIBRATE MODEL=default

[gcode_macro A13_CARTO_LOAD_DEFAULT]
description: Load fallback default scan + touch models
gcode:
    CARTOGRAPHER_SCAN_MODEL LOAD=default
    CARTOGRAPHER_TOUCH_MODEL LOAD=default

