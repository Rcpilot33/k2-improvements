# Cartographer macros — wrapped CARTOGRAPHER_* commands for Fluidd buttons.
#
# The numeric prefixes keep profile selection and shared actions at the top of
# Fluidd's alphabetical macro list. The selected profile resets to default
# after a Klipper restart.

[gcode_macro _CARTO_PROFILE_STATE]
variable_surface: "default"
gcode:

# ===== SELECT CALIBRATION PROFILE =====

[gcode_macro A11_CARTO_SELECT_DEFAULT]
description: Select the fallback default Cartographer profile
gcode:
    SET_GCODE_VARIABLE MACRO=_CARTO_PROFILE_STATE VARIABLE=surface VALUE="'default'"
    RESPOND TYPE=command MSG="Cartographer profile selected: default"

[gcode_macro A12_CARTO_SELECT_TEXTURED_PEI]
description: Select the Textured PEI Cartographer profile
gcode:
    SET_GCODE_VARIABLE MACRO=_CARTO_PROFILE_STATE VARIABLE=surface VALUE="'textured_pei'"
    RESPOND TYPE=command MSG="Cartographer profile selected: textured_pei"

[gcode_macro A13_CARTO_SELECT_EPOXY]
description: Select the Epoxy Resin Cartographer profile
gcode:
    SET_GCODE_VARIABLE MACRO=_CARTO_PROFILE_STATE VARIABLE=surface VALUE="'epoxy'"
    RESPOND TYPE=command MSG="Cartographer profile selected: epoxy"

[gcode_macro A14_CARTO_SELECT_HIGH_TEMP]
description: Select the Smooth PEI / High Temp Cartographer profile
gcode:
    SET_GCODE_VARIABLE MACRO=_CARTO_PROFILE_STATE VARIABLE=surface VALUE="'high_temp'"
    RESPOND TYPE=command MSG="Cartographer profile selected: high_temp"

[gcode_macro A15_CARTO_SELECT_CUSTOM]
description: Select the Customized Plate Cartographer profile
gcode:
    SET_GCODE_VARIABLE MACRO=_CARTO_PROFILE_STATE VARIABLE=surface VALUE="'custom'"
    RESPOND TYPE=command MSG="Cartographer profile selected: custom"

# ===== CALIBRATE OR LOAD SELECTED PROFILE =====

[gcode_macro A21_CARTO_SCAN_SELECTED]
description: Calibrate the selected Cartographer SCAN model (manual)
gcode:
    {% set surface = printer["gcode_macro _CARTO_PROFILE_STATE"].surface %}
    RESPOND TYPE=command MSG="Calibrating scan model: {surface}"
    CARTOGRAPHER_SCAN_CALIBRATE METHOD=manual MODEL={surface}

[gcode_macro A22_CARTO_TOUCH_SELECTED]
description: Calibrate the selected Cartographer TOUCH model
gcode:
    {% set surface = printer["gcode_macro _CARTO_PROFILE_STATE"].surface %}
    {% set touch_start = params.START|default(printer["gcode_macro _START_PRINT_VARS"].carto_touch_calibrate_start)|int %}
    RESPOND TYPE=command MSG="Calibrating touch model: {surface} (START={touch_start})"
    CARTOGRAPHER_TOUCH_CALIBRATE MODEL={surface} START={touch_start}

[gcode_macro A23_CARTO_LOAD_SELECTED]
description: Load the selected Cartographer scan + touch models
gcode:
    {% set surface = printer["gcode_macro _CARTO_PROFILE_STATE"].surface %}
    RESPOND TYPE=command MSG="Loading scan + touch models: {surface}"
    CARTOGRAPHER_SCAN_MODEL LOAD={surface}
    CARTOGRAPHER_TOUCH_MODEL LOAD={surface}

# ===== UTILITY / DEBUG =====

[gcode_macro A61_CARTO_TOUCH_HOME]
description: Z-reference the toolhead by touching the bed (replaces G28 Z)
gcode:
    CARTOGRAPHER_TOUCH_HOME

[gcode_macro A62_CARTO_LIST_MODELS]
description: List all saved scan and touch models in the console
gcode:
    RESPOND TYPE=command MSG="--- Scan models ---"
    CARTOGRAPHER_SCAN_MODEL
    RESPOND TYPE=command MSG="--- Touch models ---"
    CARTOGRAPHER_TOUCH_MODEL

[gcode_macro A63_CARTO_INFO]
description: Show Cartographer probe firmware/hardware info
gcode:
    CARTOGRAPHER_QUERY
